<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>INIADの紹介</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --ink: #20364b;
        --accent: #147d82;
        --background: #f2f6f7;
        --surface: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: 860px;
        margin: 0 auto;
        padding: 2rem clamp(1rem, 5vw, 3rem);
        background: var(--background);
        color: var(--ink);
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        line-height: 1.8;
      }

      h1 {
        margin: 0 -1rem 2rem;
        padding: 2rem 1rem;
        border-radius: 12px;
        background: linear-gradient(135deg, #173b58, var(--accent));
        color: var(--surface);
        text-align: center;
        font-size: clamp(1.8rem, 5vw, 2.5rem);
      }

      h2 {
        margin: 2rem 0 0.75rem;
        padding-left: 0.75rem;
        border-left: 4px solid var(--accent);
        font-size: 1.35rem;
      }

      p {
        margin: 0;
        padding: 1.25rem 1.5rem;
        border-radius: 10px;
        background: var(--surface);
      }

      ul {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        padding: 0.8rem 1rem;
        border: 1px solid #dce7e9;
        border-radius: 8px;
        background: var(--surface);
      }
    </style>
  </head>
  <body>
    <h1>INIADの紹介</h1>
    <h2>概要</h2>
    <p>INIADでは入学直後から、世界中で使われているプログラミング言語「Python」を学びます。さらに、ソースプログラム管理システム「Git」を用いたチームでのWebサービス開発も学びます。</p>
    <h2>科目群一覧</h2>
    <ul>
      <li>コンピュータ・システム</li>
      <li>コンピュータ・ソフトウェア</li>
      <li>ユーザ・エクスペリエンス</li>
      <li>データサイエンス</li>
      <li>ICT社会応用</li>
      <li>連携科目群</li>
      <li>ビジネス構築</li>
      <li>コミュニティ形成</li>
    </ul>
  </body>
</html>
